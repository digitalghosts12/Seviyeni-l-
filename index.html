<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dil Seviye Testi | A1 - C2</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --primary: #3b82f6;
    --success: #22c55e;
    --danger: #ef4444;
    --text: #f1f5f9;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
  }
  .container {
    max-width: 820px;
    margin: 0 auto;
    padding: 20px;
  }
  header {
    text-align: center;
    padding: 40px 0 30px;
  }
  header h1 {
    font-size: 2.2rem;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #60a5fa, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  header p { color: var(--muted); font-size: 1.1rem; }

  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 24px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
  }

  .lang-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 14px;
  }
  .lang-btn {
    background: #334155;
    border: 2px solid transparent;
    color: white;
    padding: 18px 12px;
    border-radius: 12px;
    font-size: 1.05rem;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .lang-btn:hover {
    background: #475569;
    transform: translateY(-2px);
  }
  .lang-btn.active {
    border-color: var(--primary);
    background: #1e40af;
  }

  .progress-bar {
    height: 10px;
    background: #334155;
    border-radius: 20px;
    overflow: hidden;
    margin: 20px 0;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #3b82f6, #8b5cf6);
    width: 0%;
    transition: width 0.3s;
  }

  .question-box h2 {
    font-size: 1.35rem;
    margin-bottom: 20px;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .option {
    background: #334155;
    border: 2px solid transparent;
    padding: 16px 18px;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 1.05rem;
  }
  .option:hover { background: #475569; }
  .option.selected { border-color: var(--primary); background: #1e3a8a; }
  .option.correct { border-color: var(--success); background: #14532d; }
  .option.wrong { border-color: var(--danger); background: #7f1d1d; }

  .btn {
    display: inline-block;
    background: var(--primary);
    color: white;
    border: none;
    padding: 14px 28px;
    border-radius: 10px;
    font-size: 1.05rem;
    cursor: pointer;
    transition: background 0.2s;
    margin-top: 20px;
  }
  .btn:hover { background: #2563eb; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-success { background: var(--success); }
  .btn-success:hover { background: #16a34a; }

  .result-box {
    text-align: center;
    padding: 40px 20px;
  }
  .result-box .level {
    font-size: 3.5rem;
    font-weight: 800;
    margin: 20px 0;
    background: linear-gradient(90deg, #22c55e, #3b82f6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .result-box .score {
    font-size: 1.4rem;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .level-desc {
    background: #1e293b;
    border-radius: 12px;
    padding: 20px;
    margin: 25px 0;
    text-align: left;
    font-size: 1.05rem;
  }

  .hidden { display: none !important; }

  footer {
    text-align: center;
    padding: 30px;
    color: var(--muted);
    font-size: 0.9rem;
  }

  @media (max-width: 600px) {
    header h1 { font-size: 1.7rem; }
    .lang-grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Dil Seviye Testi</h1>
    <p>A1 – C2 arası seviyeni ölç • Her dilde 30 soru</p>
  </header>

  <!-- DİL SEÇİM EKRANI -->
  <div id="langScreen" class="card">
    <h2 style="margin-bottom:18px;text-align:center;">Hangi dili test etmek istiyorsun?</h2>
    <div class="lang-grid" id="langGrid"></div>
  </div>

  <!-- QUIZ EKRANI -->
  <div id="quizScreen" class="card hidden">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <span id="langName" style="font-weight:600;color:#60a5fa;"></span>
      <span id="qCounter" style="color:var(--muted);"></span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="question-box">
      <h2 id="questionText"></h2>
      <div class="options" id="options"></div>
    </div>
    <button class="btn" id="nextBtn" disabled>Sonraki Soru →</button>
  </div>

  <!-- SONUÇ EKRANI -->
  <div id="resultScreen" class="card hidden">
    <div class="result-box">
      <div style="font-size:1.2rem;color:var(--muted);">Test tamamlandı!</div>
      <div class="level" id="finalLevel">B1</div>
      <div class="score" id="finalScore">0 / 30 doğru</div>
      <div class="level-desc" id="levelDesc"></div>
      <button class="btn btn-success" onclick="goHome()">Ana Sayfaya Dön</button>
    </div>
  </div>

  <footer>
    CEFR standartlarına göre hazırlanmıştır • A1 → C2
  </footer>
</div>

// Dil isimleri (Türkçe)
const langNames = {
  english: "İngilizce",
  russian: "Rusça",
  german: "Almanca",
  french: "Fransızca",
  japanese: "Japonca",
  korean: "Korece",
  italian: "İtalyanca",
  spanish: "İspanyolca"
};

// Seviye açıklamaları
const levelInfo = {
  A1: "Başlangıç seviyesi. Temel kelimeler ve basit cümleler kurabiliyorsun.",
  A2: "Temel seviye. Günlük basit konuşmaları anlayıp katılabiliyorsun.",
  B1: "Orta seviye. Günlük hayatın çoğu durumunda kendini ifade edebiliyorsun.",
  B2: "Orta-üstü seviye. Karmaşık metinleri anlayıp akıcı konuşabiliyorsun.",
  C1: "İleri seviye. Akademik ve profesyonel ortamlarda rahatça kullanabiliyorsun.",
  C2: "Uzman seviye. Ana dili konuşanlara yakın hakimiyetin var."
};

// ===================== UYGULAMA =====================
let currentLang = null;
let currentQuestions = [];
let currentIndex = 0;
let score = 0;
let selectedOption = null;

// Dil butonlarını oluştur
const langGrid = document.getElementById("langGrid");
Object.keys(langNames).forEach(key => {
  const btn = document.createElement("button");
  btn.className = "lang-btn";
  btn.textContent = langNames[key];
  btn.onclick = () => startQuiz(key);
  langGrid.appendChild(btn);
});

function startQuiz(lang) {
  currentLang = lang;
  currentQuestions = questions[lang];
  currentIndex = 0;
  score = 0;
  selectedOption = null;

  document.getElementById("langScreen").classList.add("hidden");
  document.getElementById("quizScreen").classList.remove("hidden");
  document.getElementById("resultScreen").classList.add("hidden");

  document.getElementById("langName").textContent = langNames[lang];
  showQuestion();
}

function showQuestion() {
  const q = currentQuestions[currentIndex];
  document.getElementById("questionText").textContent = `${currentIndex + 1}. ${q.q}`;
  document.getElementById("qCounter").textContent = `${currentIndex + 1} / ${currentQuestions.length}`;
  document.getElementById("progressFill").style.width = `${((currentIndex) / currentQuestions.length) * 100}%`;

  const optionsDiv = document.getElementById("options");
  optionsDiv.innerHTML = "";
  selectedOption = null;
  document.getElementById("nextBtn").disabled = true;

  q.opts.forEach((opt, i) => {
    const div = document.createElement("div");
    div.className = "option";
    div.textContent = opt;
    div.onclick = () => selectOption(div, i);
    optionsDiv.appendChild(div);
  });
}

function selectOption(div, index) {
  if (selectedOption !== null) return;

  selectedOption = index;
  const options = document.querySelectorAll(".option");
  options.forEach(o => o.classList.remove("selected"));
  div.classList.add("selected");

  const correct = currentQuestions[currentIndex].ans;
  if (index === correct) {
    div.classList.add("correct");
    score++;
  } else {
    div.classList.add("wrong");
    options[correct].classList.add("correct");
  }

  document.getElementById("nextBtn").disabled = false;
}

document.getElementById("nextBtn").onclick = () => {
  currentIndex++;
  if (currentIndex < currentQuestions.length) {
    showQuestion();
  } else {
    showResult();
  }
};

function showResult() {
  document.getElementById("quizScreen").classList.add("hidden");
  document.getElementById("resultScreen").classList.remove("hidden");

  const percentage = (score / currentQuestions.length) * 100;
  let level = "A1";
  if (percentage >= 90) level = "C2";
  else if (percentage >= 75) level = "C1";
  else if (percentage >= 60) level = "B2";
  else if (percentage >= 45) level = "B1";
  else if (percentage >= 30) level = "A2";
  else level = "A1";

  document.getElementById("finalLevel").textContent = level;
  document.getElementById("finalScore").textContent = `${score} / ${currentQuestions.length} doğru`;
  document.getElementById("levelDesc").textContent = levelInfo[level];
}

// Ana sayfaya dön
function goHome() {
  document.getElementById("resultScreen").classList.add("hidden");
  document.getElementById("quizScreen").classList.add("hidden");
  document.getElementById("langScreen").classList.remove("hidden");
  
  // Değişkenleri sıfırla
  currentLang = null;
  currentQuestions = [];
  currentIndex = 0;
  score = 0;
  selectedOption = null;
}
